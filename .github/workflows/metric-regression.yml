name: Metric timestamp validation

on:
  push:
    branches: [ci/metric-oracle-restamping]

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3
        with:
          tool: cargo-nextest
      - name: Prove the captured Metric quote fails before the fix
        run: |
          git fetch --no-tags --depth=1 origin 92ec935122332a75ca53c777a1b16158f3b5c0b2
          cp crates/simulator/src/state_override_stream.rs /tmp/proposed-state-override-stream.rs
          trap 'cp /tmp/proposed-state-override-stream.rs crates/simulator/src/state_override_stream.rs' EXIT
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          path = Path("crates/simulator/src/state_override_stream.rs")
          proposed = path.read_text()
          baseline = subprocess.check_output(["git", "show", "92ec935122332a75ca53c777a1b16158f3b5c0b2:" + str(path)], text=True)
          start = "    #[test]\n    fn metric_quote_is_restamped_to_the_simulated_block()"
          marker = "    #[test]\n    fn lane_not_requoted_keeps_its_stale_stamp()"
          test = proposed[proposed.index(start):proposed.index(marker)]
          assert baseline.count(marker) == 1
          path.write_text(baseline.replace(marker, test + marker))
          PYCODE
          set +e
          cargo nextest run --locked -p simulator -E 'test(metric_quote_is_restamped_to_the_simulated_block)'
          result=$?
          set -e
          test "$result" -eq 100
      - name: Run simulator tests with the fix
        run: cargo nextest run --locked -p simulator
      - run: cargo clippy --locked -p simulator --all-features --all-targets -- -D warnings
